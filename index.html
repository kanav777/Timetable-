<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0e0e0f">
<title>Kanav · School</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════════════════════ */
:root {
  --bg: #0e0e0f;
  --surface: #161618;
  --border: #2a2a2e;
  --accent: #c9a96e;
  --accent2: #7c6aff;
  --warning: #ff9f43;
  --danger: #ff6b6b;
  --text: #e8e4dc;
  --muted: #5a5a6a;
  --done: #2a2a2e;
  --done-text: #44444e;
  --current-bg: #1a1a10;
  --upcoming: #131318;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ═══════════════════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════════════════ */
header {
  padding: 28px 20px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.day-label {
  font-family: 'Playfair Display', serif;
  font-size: 11px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 4px;
}
.day-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 700;
  line-height: 1.1;
}
.time-now {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
  letter-spacing: 0.05em;
}

/* ═══════════════════════════════════════════════════════════════════
   DAY SWITCHER
═══════════════════════════════════════════════════════════════════ */
.day-switcher {
  display: flex;
  gap: 4px;
  margin-top: 14px;
  overflow-x: auto;
  scrollbar-width: none;
}
.day-switcher::-webkit-scrollbar { display: none; }

.day-pill {
  flex-shrink: 0;
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}
.day-pill.today { border-color: var(--accent); color: var(--accent); }
.day-pill.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 700;
}
.reset-link {
  display: none;
  font-size: 10px;
  color: var(--accent2);
  margin-top: 8px;
  cursor: pointer;
}
.reset-link.show { display: inline-block; }

/* ═══════════════════════════════════════════════════════════════════
   TIMELINE & PERIOD ROWS
═══════════════════════════════════════════════════════════════════ */
.timeline { padding: 12px 0 40px; }

.period-row {
  display: flex;
  align-items: stretch;
  padding: 0 20px;
  margin-bottom: 2px;
}
.time-col {
  width: 58px;
  flex-shrink: 0;
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  padding: 14px 14px 0 0;
}
.time-start { font-size: 10px; color: var(--muted); letter-spacing: 0.03em; }

.line-col {
  width: 2px;
  flex-shrink: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.line-col .vline {
  position: absolute;
  top: 0; bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 1px;
  background: var(--border);
}
.dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
  margin-top: 18px;
  position: relative;
  z-index: 2;
}

.card-col { flex: 1; padding: 8px 0 8px 14px; }
.card {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  background: var(--surface);
  position: relative;
}

.row-done .dot { background: var(--done-text); }
.row-done .card { background: var(--done); border-color: var(--done); }
.row-done .card-title, .row-done .card-sub { color: var(--done-text); }
.row-done .period-tag { opacity: 0.3; }

.row-current .dot {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  width: 10px; height: 10px;
  margin-left: -1px;
}
.row-current .card {
  background: var(--current-bg);
  border-color: var(--accent);
  border-left-width: 3px;
}
.row-current .card-title { color: var(--accent); }

.row-upcoming .card { background: var(--upcoming); }

.period-tag {
  font-size: 9px;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 3px;
}
.card-title {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
}
.card-sub {
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
  letter-spacing: 0.04em;
}

.badge {
  display: inline-block;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
  vertical-align: middle;
}
.badge-now    { background: var(--accent); color: #000; }
.badge-today  { background: var(--warning); color: #000; }
.badge-edited { background: var(--accent2); color: #000; }

.progress-bar {
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 1s linear;
}

.edit-icon {
  position: absolute;
  top: 8px; right: 8px;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.edit-icon:active { border-color: var(--accent); color: var(--accent); }

.diary-row .card {
  background: #0f0f1a;
  border-color: var(--accent2);
  border-left: 3px solid var(--accent2);
}
.diary-row .card-title { color: var(--accent2); }
.diary-row .dot { background: var(--accent2); }

.recess-row .card {
  background: transparent;
  border: 1px dashed var(--border);
  text-align: center;
  padding: 8px 14px;
}
.recess-row .card-title {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.recess-row .card-sub,
.recess-row .period-tag,
.recess-row .edit-icon { display: none; }
.recess-row .dot { background: var(--bg); border: 1px dashed var(--border); }

.break-row { display: flex; padding: 0 20px; margin-bottom: 2px; }
.break-time-col { width: 58px; flex-shrink: 0; }
.break-line-col { width: 2px; flex-shrink: 0; position: relative; }
.break-line-col .vline {
  position: absolute;
  top: 0; bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 1px;
  background: var(--border);
}
.break-content {
  flex: 1;
  padding: 6px 14px;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.no-school {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 60vh;
  gap: 12px;
  text-align: center;
}
.no-school-icon { font-size: 48px; }
.no-school-text {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  color: var(--accent);
}
.no-school-sub { font-size: 12px; color: var(--muted); }

/* ═══════════════════════════════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════════════════════════════ */
.footer {
  padding: 0 20px 24px;
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.06em;
  line-height: 1.8;
}
.footer-link {
  color: var(--muted);
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: var(--border);
}
.footer-link:active { color: var(--accent); }
.footer-link.danger:active { color: var(--danger); }

/* ═══════════════════════════════════════════════════════════════════
   MODAL
═══════════════════════════════════════════════════════════════════ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.modal-backdrop.show { display: flex; }
.modal {
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  width: 100%;
  max-width: 500px;
  padding: 20px;
  animation: slideUp 0.2s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  color: var(--accent);
  margin-bottom: 4px;
}
.modal-sub {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.input-group { margin-bottom: 14px; }
.input-label {
  display: block;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.input-field {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
}
.input-field:focus { outline: none; border-color: var(--accent); }

.scope-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
.scope-option {
  flex: 1;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  text-align: left;
  transition: all 0.15s;
}
.scope-option .scope-title {
  display: block;
  color: var(--text);
  font-weight: 700;
  margin-bottom: 2px;
  font-size: 12px;
}
.scope-option .scope-desc {
  font-size: 9px;
  color: var(--muted);
  letter-spacing: 0.03em;
}
.scope-option.selected {
  border-color: var(--accent);
  background: var(--current-bg);
}
.scope-option.selected .scope-title { color: var(--accent); }

.modal-actions { display: flex; gap: 8px; margin-top: 18px; }
.btn {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
}
.btn-primary {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 700;
}
.btn-clear { flex: 0.6; color: var(--muted); }
.btn-danger { color: var(--danger); border-color: rgba(255,107,107,0.3); }

/* ═══════════════════════════════════════════════════════════════════
   TIMES EDITOR
═══════════════════════════════════════════════════════════════════ */
.times-screen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  display: none;
  flex-direction: column;
}
.times-screen.show { display: flex; }
.times-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.times-title {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  color: var(--accent);
}
.times-close {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
}
.times-body { flex: 1; overflow-y: auto; padding: 12px 20px 20px; }
.time-row {
  display: grid;
  grid-template-columns: 60px 1fr 14px 1fr;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.time-row-label {
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 0.08em;
  font-weight: 700;
}
.time-input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  text-align: center;
  width: 100%;
}
.time-input:focus { outline: none; border-color: var(--accent); }
.time-dash { color: var(--muted); text-align: center; font-size: 12px; }
.times-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
</style>
</head>
<body>

<header>
  <div class="day-label" id="dayLabel">Loading...</div>
  <div class="day-title" id="dayTitle">—</div>
  <div class="time-now" id="timeNow">—</div>
  <div class="day-switcher" id="daySwitcher"></div>
  <span class="reset-link" id="resetLink">← Back to today</span>
</header>

<div id="content"></div>

<!-- Edit modal -->
<div class="modal-backdrop" id="editModal">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="editTitle">Edit Period</div>
    <div class="modal-sub" id="editSub">—</div>

    <div class="scope-toggle">
      <button class="scope-option selected" data-scope="permanent">
        <span class="scope-title">📌 Permanent</span>
        <span class="scope-desc">Change going forward</span>
      </button>
      <button class="scope-option" data-scope="today">
        <span class="scope-title">📅 Today only</span>
        <span class="scope-desc">Resets tomorrow</span>
      </button>
    </div>

    <div class="input-group">
      <label class="input-label">Class Title</label>
      <input type="text" class="input-field" id="inputTitle" placeholder="e.g. XII Arts (empty = free)">
    </div>
    <div class="input-group">
      <label class="input-label">Note / Subtitle</label>
      <input type="text" class="input-field" id="inputSub" placeholder="e.g. Senior → Art Room">
    </div>

    <div class="modal-actions">
      <button class="btn btn-clear" id="btnClear">Clear</button>
      <button class="btn" id="btnCancel">Cancel</button>
      <button class="btn btn-primary" id="btnSave">Save</button>
    </div>
  </div>
</div>

<!-- Times editor -->
<div class="times-screen" id="timesScreen">
  <div class="times-header">
    <div>
      <div class="times-title">Edit Period Times</div>
      <div class="modal-sub" style="margin:0">HH:MM in 24-hour format</div>
    </div>
    <button class="times-close" id="timesClose">✕</button>
  </div>
  <div class="times-body" id="timesBody"></div>
  <div class="times-footer">
    <button class="btn btn-danger" id="timesReset">Reset</button>
    <button class="btn btn-primary" id="timesSave">Save</button>
  </div>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════
   1. CONSTANTS & DEFAULT DATA
═══════════════════════════════════════════════════════════════════ */
const DAYS = {1:'Monday',2:'Tuesday',3:'Wednesday',4:'Thursday',5:'Friday',6:'Saturday'};
const DAY_SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat'];

const PERIOD_ORDER = ['P0','P1','P2','P3','RECESS','P4','P5','P6','P7','DIARY'];

const PERIOD_LABELS = {
  P0:'Period 0', P1:'Period 1', P2:'Period 2', P3:'Period 3',
  RECESS:'Recess',
  P4:'Period 4', P5:'Period 5', P6:'Period 6', P7:'Period 7',
  DIARY:'Diary'
};

// Time entries: [startH, startM, endH, endM]; null = unknown
const DEFAULT_TIMES = {
  P0:    [7, 20, 8, 55],
  P1:    [9, 5, null, null],
  P2:    [null, null, null, null],
  P3:    [null, null, 10, 50],
  RECESS:[10, 50, 11, 10],
  P4:    [11, 10, null, null],
  P5:    [null, null, null, null],
  P6:    [null, null, null, null],
  P7:    [13, 0, 13, 30],
  DIARY: [13, 30, 13, 45],
};

// Reusable class cells
const ART_SUB = 'Senior → Art Room';
const JUN_SUB = 'Junior → Their Class';
const XII_REM = { title: 'XII Arts (Rem.)', sub: ART_SUB };
const XII_CA  = { title: 'XII (Comm + Arts) Rem.', sub: ART_SUB };
const XII_ALL = { title: 'XII (Sci + Comm + Arts)', sub: ART_SUB };
const XI_SCI  = { title: 'XI (Sci + Arts + Comm)', sub: ART_SUB };
const RECESS_CELL = { title: 'Recess', sub: '20 min break' };
const DIARY_CELL  = { title: 'Diary', sub: 'End of day' };
const cls = (n) => ({ title: n, sub: JUN_SUB });

const DEFAULT_SCHEDULE = {
  1: { P0:null,        P1:null, P2:null,       P3:XII_REM, RECESS:RECESS_CELL, P4:null,   P5:XI_SCI,   P6:null,    P7:XII_ALL, DIARY:DIARY_CELL },
  2: { P0:null,        P1:null, P2:cls('IXC'), P3:XII_REM, RECESS:RECESS_CELL, P4:null,   P5:XI_SCI,   P6:null,    P7:XII_ALL, DIARY:DIARY_CELL },
  3: { P0:cls('XA'),   P1:null, P2:null,       P3:XII_REM, RECESS:RECESS_CELL, P4:XII_CA, P5:null,     P6:null,    P7:XII_ALL, DIARY:DIARY_CELL },
  4: { P0:cls('XC'),   P1:null, P2:null,       P3:XII_REM, RECESS:RECESS_CELL, P4:XII_CA, P5:null,     P6:{title:'PT (Sub)',sub:'Substitute Duty — Provisional'}, P7:XII_ALL, DIARY:DIARY_CELL },
  5: { P0:cls('XB'),   P1:null, P2:null,       P3:XII_REM, RECESS:RECESS_CELL, P4:null,   P5:cls('IXA'), P6:XII_ALL, P7:XII_ALL, DIARY:DIARY_CELL },
  6: { P0:null,        P1:cls('IXB'), P2:null, P3:XII_REM, RECESS:RECESS_CELL, P4:null,   P5:null,     P6:XII_ALL, P7:XII_ALL, DIARY:DIARY_CELL },
};

/* ═══════════════════════════════════════════════════════════════════
   2. STORAGE
═══════════════════════════════════════════════════════════════════ */
const KEY_PERM  = 'kanav_tt_perm_v1';
const KEY_TODAY = 'kanav_tt_today_v1';
const KEY_TIMES = 'kanav_tt_times_v1';

const Storage = {
  load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch { return fallback; }
  },
  save(key, val) { localStorage.setItem(key, JSON.stringify(val)); },
  clear(key)     { localStorage.removeItem(key); }
};

function todayDateStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Today-only overrides auto-purge when the date changes
function getTodayOverrides() {
  const data = Storage.load(KEY_TODAY, null);
  if (!data || data.date !== todayDateStr()) {
    if (data) Storage.clear(KEY_TODAY);
    return {};
  }
  return data.overrides || {};
}
function setTodayOverride(period, value) {
  const o = getTodayOverrides();
  o[period] = value;
  Storage.save(KEY_TODAY, { date: todayDateStr(), overrides: o });
}
function clearTodayOverride(period) {
  const o = getTodayOverrides();
  delete o[period];
  if (Object.keys(o).length === 0) Storage.clear(KEY_TODAY);
  else Storage.save(KEY_TODAY, { date: todayDateStr(), overrides: o });
}

function getPermOverrides() { return Storage.load(KEY_PERM, {}); }
function setPermOverride(day, period, value) {
  const o = getPermOverrides();
  if (!o[day]) o[day] = {};
  o[day][period] = value;
  Storage.save(KEY_PERM, o);
}
function clearPermOverride(day, period) {
  const o = getPermOverrides();
  if (o[day]) {
    delete o[day][period];
    if (Object.keys(o[day]).length === 0) delete o[day];
    Storage.save(KEY_PERM, o);
  }
}

function getTimeOverrides() { return Storage.load(KEY_TIMES, {}); }
function setTimeOverrides(t) { Storage.save(KEY_TIMES, t); }

/* ═══════════════════════════════════════════════════════════════════
   3. DATA MERGING
   Priority: today-only > permanent > default
═══════════════════════════════════════════════════════════════════ */
function getMergedSchedule(dayNum, isToday) {
  const merged = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE[dayNum]));
  const editFlags = {};

  const perm = getPermOverrides()[dayNum] || {};
  for (const p in perm) {
    merged[p] = perm[p];
    editFlags[p] = 'permanent';
  }

  if (isToday) {
    const today = getTodayOverrides();
    for (const p in today) {
      merged[p] = today[p];
      editFlags[p] = 'today';
    }
  }
  return { schedule: merged, edited: editFlags };
}

function getMergedTimes() {
  return Object.assign({}, DEFAULT_TIMES, getTimeOverrides());
}

/* ═══════════════════════════════════════════════════════════════════
   4. TIME HELPERS
═══════════════════════════════════════════════════════════════════ */
const toMins = (h, m) => h * 60 + m;

function nowMins() {
  const n = new Date();
  return toMins(n.getHours(), n.getMinutes());
}

function fmtTime(h, m) {
  if (h === null || h === undefined) return '—:——';
  const suffix = h >= 12 ? 'PM' : 'AM';
  const hh = h > 12 ? h - 12 : h === 0 ? 12 : h;
  return `${hh}:${String(m).padStart(2,'0')} ${suffix}`;
}

function parseHHMM(str) {
  if (!str || !str.trim()) return [null, null];
  const m = str.trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return [null, null];
  const h = parseInt(m[1]), min = parseInt(m[2]);
  if (h < 0 || h > 23 || min < 0 || min > 59) return [null, null];
  return [h, min];
}

function formatHHMM(h, m) {
  if (h === null || h === undefined) return '';
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function getPeriodStatus(pKey, isToday) {
  if (!isToday) return 'upcoming';
  const t = getMergedTimes()[pKey];
  if (!t || t[0] === null || t[2] === null) return 'upcoming';
  const start = toMins(t[0], t[1]);
  const end = toMins(t[2], t[3]);
  const now = nowMins();
  if (now < start) return 'upcoming';
  if (now >= end) return 'done';
  return 'current';
}

function getProgress(pKey) {
  const t = getMergedTimes()[pKey];
  if (!t || t[0] === null || t[2] === null) return 0;
  const start = toMins(t[0], t[1]);
  const end = toMins(t[2], t[3]);
  const now = nowMins();
  return Math.min(100, Math.max(0, ((now - start) / (end - start)) * 100));
}

/* ═══════════════════════════════════════════════════════════════════
   5. STATE
═══════════════════════════════════════════════════════════════════ */
const state = {
  viewingDay: null,   // null = today; 1-6 to preview
  editing: { day: null, period: null, scope: 'permanent' }
};

function getRealDay() {
  const d = new Date().getDay();
  return d === 0 ? null : d;
}

const $ = (id) => document.getElementById(id);

/* ═══════════════════════════════════════════════════════════════════
   6. RENDER
═══════════════════════════════════════════════════════════════════ */
function renderHeader(realDay) {
  const now = new Date();
  $('timeNow').textContent =
    now.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', hour12:true });

  const viewing = state.viewingDay || realDay;
  const isPreview = state.viewingDay && state.viewingDay !== realDay;

  if (!viewing) {
    $('dayLabel').textContent = 'Day Off';
    $('dayTitle').textContent = 'Sunday';
  } else {
    $('dayLabel').textContent = isPreview
      ? `Previewing · Day ${viewing}`
      : `Day ${viewing} · SD Public School`;
    $('dayTitle').textContent = DAYS[viewing];
  }
}

function renderDaySwitcher(realDay) {
  const showingDay = state.viewingDay || realDay;
  $('daySwitcher').innerHTML = [1,2,3,4,5,6].map(n => {
    const cls = ['day-pill'];
    if (n === realDay) cls.push('today');
    if (n === showingDay) cls.push('active');
    return `<button class="${cls.join(' ')}" data-day="${n}">D${n} · ${DAY_SHORT[n-1]}</button>`;
  }).join('');

  document.querySelectorAll('.day-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = parseInt(btn.dataset.day);
      state.viewingDay = (d === realDay) ? null : d;
      render();
    });
  });

  $('resetLink').classList.toggle('show', state.viewingDay && state.viewingDay !== realDay);
}

function renderPeriodRow(pKey, dayNum, classData, isToday, editFlag) {
  const times = getMergedTimes()[pKey];
  const status = getPeriodStatus(pKey, isToday);
  const startStr = (times && times[0] !== null) ? fmtTime(times[0], times[1]) : '—';
  const isDiary = pKey === 'DIARY';
  const isRecess = pKey === 'RECESS';

  const rowClasses = [`row-${status}`];
  if (isDiary) rowClasses.push('diary-row');
  if (isRecess) rowClasses.push('recess-row');

  let badges = '';
  if (status === 'current') badges += '<span class="badge badge-now">NOW</span>';
  if (editFlag === 'today') badges += '<span class="badge badge-today">TODAY</span>';
  else if (editFlag === 'permanent') badges += '<span class="badge badge-edited">EDITED</span>';

  const progressHTML = status === 'current'
    ? `<div class="progress-bar"><div class="progress-fill" style="width:${getProgress(pKey)}%"></div></div>`
    : '';

  let cardInner;
  if (isRecess) {
    cardInner = `<div class="card-title">☕ Recess${badges}</div>${progressHTML}`;
  } else {
    const editBtn = `<button class="edit-icon" data-day="${dayNum}" data-period="${pKey}">✎</button>`;
    if (classData) {
      cardInner = `
        ${editBtn}
        <div class="period-tag">${PERIOD_LABELS[pKey]}</div>
        <div class="card-title">${classData.title}${badges}</div>
        <div class="card-sub">${classData.sub || ''}</div>
        ${progressHTML}`;
    } else {
      cardInner = `
        ${editBtn}
        <div class="period-tag">${PERIOD_LABELS[pKey]}</div>
        <div class="card-title" style="color:var(--muted)">Free Period${badges}</div>
        ${progressHTML}`;
    }
  }

  return `
    <div class="period-row ${rowClasses.join(' ')}">
      <div class="time-col"><span class="time-start">${startStr}</span></div>
      <div class="line-col"><div class="vline"></div><div class="dot"></div></div>
      <div class="card-col"><div class="card">${cardInner}</div></div>
    </div>`;
}

function renderTimeline(dayNum, isToday) {
  const { schedule, edited } = getMergedSchedule(dayNum, isToday);
  let html = '<div class="timeline">';
  PERIOD_ORDER.forEach(pKey => {
    if (pKey === 'P1') {
      html += `<div class="break-row">
        <div class="break-time-col"></div>
        <div class="break-line-col"><div class="vline"></div></div>
        <div class="break-content">── 10 min break ──</div>
      </div>`;
    }
    html += renderPeriodRow(pKey, dayNum, schedule[pKey], isToday, edited[pKey]);
  });
  html += '</div>';
  return html;
}

function renderFooter() {
  const hasAny = Object.keys(getPermOverrides()).length > 0
              || Object.keys(getTodayOverrides()).length > 0
              || Object.keys(getTimeOverrides()).length > 0;

  return `<div class="footer">
    Tap ✎ to edit any period
    <br>
    <span class="footer-link" id="editTimesBtn">⏱ Edit period times</span>
    ${hasAny ? `<br><span class="footer-link danger" id="resetAllBtn">Reset all edits</span>` : ''}
  </div>`;
}

function render() {
  const realDay = getRealDay();
  renderHeader(realDay);
  renderDaySwitcher(realDay);

  const viewing = state.viewingDay || realDay;
  if (!viewing) {
    $('content').innerHTML = `
      <div class="no-school">
        <div class="no-school-icon">☀️</div>
        <div class="no-school-text">No School Today</div>
        <div class="no-school-sub">Tap a day above to preview</div>
      </div>${renderFooter()}`;
    wireFooter();
    return;
  }

  const isToday = (viewing === realDay);
  $('content').innerHTML = renderTimeline(viewing, isToday) + renderFooter();
  wireEditButtons();
  wireFooter();
}

/* ═══════════════════════════════════════════════════════════════════
   7. EVENT WIRING
═══════════════════════════════════════════════════════════════════ */
function wireEditButtons() {
  document.querySelectorAll('.edit-icon').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openEditModal(parseInt(btn.dataset.day), btn.dataset.period);
    });
  });
}

function wireFooter() {
  const editTimes = $('editTimesBtn');
  if (editTimes) editTimes.addEventListener('click', openTimesEditor);

  const resetAll = $('resetAllBtn');
  if (resetAll) {
    resetAll.addEventListener('click', () => {
      if (confirm('Reset ALL edits (permanent, today, times) and restore defaults?')) {
        Storage.clear(KEY_PERM);
        Storage.clear(KEY_TODAY);
        Storage.clear(KEY_TIMES);
        render();
      }
    });
  }
}

$('resetLink').addEventListener('click', () => {
  state.viewingDay = null;
  render();
});

/* ═══════════════════════════════════════════════════════════════════
   8. EDIT MODAL
═══════════════════════════════════════════════════════════════════ */
function openEditModal(day, period) {
  const realDay = getRealDay();
  const isToday = (day === realDay);

  state.editing = { day, period, scope: 'permanent' };
  const { schedule } = getMergedSchedule(day, isToday);
  const current = schedule[period];

  $('editTitle').textContent = `Edit ${PERIOD_LABELS[period]}`;
  $('editSub').textContent = `Day ${day} · ${DAYS[day]}`;
  $('inputTitle').value = current ? current.title : '';
  $('inputSub').value = current ? (current.sub || '') : '';

  // "Today only" option only available when editing today
  const todayOption = document.querySelector('[data-scope="today"]');
  todayOption.style.display = isToday ? '' : 'none';
  setScope('permanent');

  $('editModal').classList.add('show');
}

function closeEditModal() {
  $('editModal').classList.remove('show');
  state.editing = { day: null, period: null, scope: 'permanent' };
}

function setScope(scope) {
  state.editing.scope = scope;
  document.querySelectorAll('.scope-option').forEach(b => {
    b.classList.toggle('selected', b.dataset.scope === scope);
  });
}

document.querySelectorAll('.scope-option').forEach(btn => {
  btn.addEventListener('click', () => setScope(btn.dataset.scope));
});

$('editModal').addEventListener('click', closeEditModal);
$('btnCancel').addEventListener('click', closeEditModal);

$('btnSave').addEventListener('click', () => {
  const { day, period, scope } = state.editing;
  if (day === null || !period) return;

  const title = $('inputTitle').value.trim();
  const sub = $('inputSub').value.trim();
  const value = title ? { title, sub } : null;

  if (scope === 'today') setTodayOverride(period, value);
  else setPermOverride(day, period, value);

  closeEditModal();
  render();
});

$('btnClear').addEventListener('click', () => {
  const { day, period, scope } = state.editing;
  if (day === null || !period) return;
  if (scope === 'today') clearTodayOverride(period);
  else clearPermOverride(day, period);
  closeEditModal();
  render();
});

/* ═══════════════════════════════════════════════════════════════════
   9. TIMES EDITOR
═══════════════════════════════════════════════════════════════════ */
function openTimesEditor() {
  const times = getMergedTimes();
  $('timesBody').innerHTML = PERIOD_ORDER.map(pKey => {
    const [sh, sm, eh, em] = times[pKey];
    return `
      <div class="time-row">
        <div class="time-row-label">${pKey === 'DIARY' ? 'DIARY' : pKey}</div>
        <input type="text" class="time-input" data-period="${pKey}" data-which="start"
               value="${formatHHMM(sh, sm)}" placeholder="HH:MM" inputmode="numeric">
        <div class="time-dash">→</div>
        <input type="text" class="time-input" data-period="${pKey}" data-which="end"
               value="${formatHHMM(eh, em)}" placeholder="HH:MM" inputmode="numeric">
      </div>`;
  }).join('');
  $('timesScreen').classList.add('show');
}

$('timesClose').addEventListener('click', () => $('timesScreen').classList.remove('show'));

$('timesSave').addEventListener('click', () => {
  const collected = {};
  document.querySelectorAll('#timesBody .time-input').forEach(inp => {
    const { period, which } = inp.dataset;
    if (!collected[period]) collected[period] = {};
    collected[period][which] = parseHHMM(inp.value);
  });
  const newTimes = {};
  for (const p in collected) {
    const s = collected[p].start || [null, null];
    const e = collected[p].end || [null, null];
    newTimes[p] = [s[0], s[1], e[0], e[1]];
  }
  setTimeOverrides(newTimes);
  $('timesScreen').classList.remove('show');
  render();
});

$('timesReset').addEventListener('click', () => {
  if (confirm('Reset all period times to defaults?')) {
    Storage.clear(KEY_TIMES);
    $('timesScreen').classList.remove('show');
    render();
  }
});

/* ═══════════════════════════════════════════════════════════════════
   10. BOOT
═══════════════════════════════════════════════════════════════════ */
render();
setInterval(render, 60000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
